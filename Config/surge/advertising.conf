[General]
dns-server = system
encrypted-dns-server = https://cloudflare-dns.com/dns-query
encrypted-dns-follow-outbound-mode = true
ipv6 = false

[Proxy]
REPLACE-ME = http, replace.invalid, 1

[Proxy Group]
RuleMesh-Nodes = select,include-all-proxies=true
RuleMesh-ai = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-anthropic = select,RuleMesh-ai,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-openai = select,RuleMesh-ai,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-gemini = select,RuleMesh-ai,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-ai-other = select,RuleMesh-ai,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-social = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-telegram = select,RuleMesh-social,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-streaming = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-youtube = select,RuleMesh-streaming,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-netflix = select,RuleMesh-streaming,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-developer = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-apple = select,DIRECT,RuleMesh-Nodes,include-all-proxies=true
RuleMesh-google = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-microsoft = select,DIRECT,RuleMesh-Nodes,include-all-proxies=true
RuleMesh-games = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-downloads = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true
RuleMesh-direct = select,DIRECT,RuleMesh-Nodes,include-all-proxies=true
RuleMesh-china = select,DIRECT,RuleMesh-Nodes,include-all-proxies=true
RuleMesh-private = select,DIRECT,RuleMesh-Nodes,include-all-proxies=true
RuleMesh-advertising = select,REJECT,DIRECT,include-all-proxies=true
RuleMesh-fallback = select,RuleMesh-Nodes,DIRECT,include-all-proxies=true

