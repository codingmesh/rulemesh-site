private = select,DIRECT,node-selection,PROXY,use=true,policy-regex-filter=.*
advertising = select,REJECT,DIRECT,PROXY,use=true,policy-regex-filter=.*
fallback = select,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*

