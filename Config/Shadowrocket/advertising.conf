social = select,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
telegram = select,social,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
streaming = select,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
youtube = select,streaming,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
netflix = select,streaming,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
developer = select,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
apple = select,DIRECT,node-selection,PROXY,use=true,policy-regex-filter=.*
google = select,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
microsoft = select,DIRECT,node-selection,PROXY,use=true,policy-regex-filter=.*
games = select,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
