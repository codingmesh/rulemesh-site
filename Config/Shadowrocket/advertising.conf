# RuleMesh complete Shadowrocket configuration
# Nodes remain in Home subscriptions; no credentials are embedded.

[General]
update-url = https://codingmesh.github.io/ruleset/Config/Shadowrocket/advertising.conf
dns-server = https://cloudflare-dns.com/dns-query#proxy
dns-direct-system = true
dns-fallback-system = false
private-ip-answer = true
ipv6 = false
prefer-ipv6 = false
udp-policy-not-supported-behaviour = REJECT

[Proxy]

[Proxy Group]
node-selection = select,PROXY,use=true,policy-regex-filter=.*
ai = select,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
anthropic = select,ai,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
openai = select,ai,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
gemini = select,ai,node-selection,DIRECT,PROXY,use=true,policy-regex-filter=.*
